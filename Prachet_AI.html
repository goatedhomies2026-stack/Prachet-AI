<script>
  // Chat state
  let chats = JSON.parse(localStorage.getItem('prachet_chats_data')) || [];
  let currentChatId = localStorage.getItem('prachet_current_chat_id') || null;

  function refreshIcons() {
    if (window.lucide && typeof lucide.createIcons === 'function') {
      lucide.createIcons();
    }
  }

  // Initial Load
  window.addEventListener('DOMContentLoaded', () => {
    refreshIcons();
    renderChatHistoryList();

    if (currentChatId && chats.find(c => c.id === currentChatId)) {
      loadChat(currentChatId);
    } else if (chats.length > 0) {
      loadChat(chats[0].id);
    } else {
      createNewChat();
    }
  });

  // Sidebar controls
  function toggleSidebar(show) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (sidebar) sidebar.classList.toggle('-translate-x-full', !show);
    if (overlay) overlay.classList.toggle('hidden', !show);
  }

  // Chat Data Management
  function createNewChat() {
    const newChat = {
      id: 'chat_' + Date.now(),
      title: 'New Conversation',
      messages: []
    };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    saveChatsToStorage();
    renderChatHistoryList();
    renderMessages();
    toggleSidebar(false);
  }

  function saveChatsToStorage() {
    localStorage.setItem('prachet_chats_data', JSON.stringify(chats));
    localStorage.setItem('prachet_current_chat_id', currentChatId);
  }

  function loadChat(id) {
    currentChatId = id;
    saveChatsToStorage();
    renderChatHistoryList();
    renderMessages();
    toggleSidebar(false);
  }

  function deleteChat(id, event) {
    if (event) event.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    if (currentChatId === id) {
      currentChatId = chats.length > 0 ? chats[0].id : null;
    }
    saveChatsToStorage();
    if (!currentChatId) createNewChat();
    else {
      renderChatHistoryList();
      renderMessages();
    }
  }

  function clearAllChats() {
    if (confirm('Are you sure you want to delete all chat history?')) {
      chats = [];
      localStorage.removeItem('prachet_chats_data');
      localStorage.removeItem('prachet_current_chat_id');
      createNewChat();
    }
  }

  // UI Rendering
  function renderChatHistoryList() {
    const container = document.getElementById('chat-history-list');
    if (!container) return;
    container.innerHTML = '';

    chats.forEach(chat => {
      const isActive = chat.id === currentChatId;
      const btn = document.createElement('div');
      btn.onclick = () => loadChat(chat.id);
      btn.className = `group flex items-center justify-between px-3 py-2.5 rounded-lg text-sm cursor-pointer transition ${
        isActive ? 'bg-white/10 text-white font-medium' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'
      }`;
      
      btn.innerHTML = `
        <div class="flex items-center gap-2.5 truncate">
          <i data-lucide="message-square" class="w-4 h-4 shrink-0 ${isActive ? 'text-indigo-400' : ''}"></i>
          <span class="truncate">${escapeHtml(chat.title)}</span>
        </div>
        <button onclick="deleteChat('${chat.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition">
          <i data-lucide="trash" class="w-3.5 h-3.5"></i>
        </button>
      `;
      container.appendChild(btn);
    });
    refreshIcons();
  }

  function renderMessages() {
    const container = document.getElementById('messages-container');
    const emptyState = document.getElementById('empty-state');
    if (!container) return;

    const activeChat = chats.find(c => c.id === currentChatId);
    container.innerHTML = '';

    if (!activeChat || activeChat.messages.length === 0) {
      if (emptyState) {
        container.appendChild(emptyState);
        emptyState.classList.remove('hidden');
      }
      return;
    }

    if (emptyState) emptyState.classList.add('hidden');

    activeChat.messages.forEach(msg => {
      const div = document.createElement('div');
      if (msg.role === 'user') {
        div.className = 'flex justify-end';
        div.innerHTML = `
          <div class="bg-indigo-600 text-white px-4 py-3 rounded-2xl max-w-[85%] md:max-w-[75%] text-sm whitespace-pre-wrap leading-relaxed shadow-sm">
            ${escapeHtml(msg.content)}
          </div>
        `;
      } else {
        div.className = 'flex items-start gap-3 max-w-[90%] md:max-w-[85%]';
        div.innerHTML = `
          <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-xl shrink-0 mt-1 border border-indigo-500/30">
            <i data-lucide="bot" class="w-4 h-4"></i>
          </div>
          <div class="bg-cardbg border border-white/10 p-4 rounded-2xl text-slate-200 text-sm whitespace-pre-wrap leading-relaxed shadow-sm flex-1">
            ${escapeHtml(msg.content)}
          </div>
        `;
      }
      container.appendChild(div);
    });

    scrollToBottom();
    refreshIcons();
  }

  function renderLoadingIndicator() {
    const container = document.getElementById('messages-container');
    if (!container) return;
    const div = document.createElement('div');
    div.id = 'loading-indicator';
    div.className = 'flex items-start gap-3 max-w-[90%] md:max-w-[85%]';
    div.innerHTML = `
      <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-xl shrink-0 mt-1 border border-indigo-500/30">
        <i data-lucide="bot" class="w-4 h-4"></i>
      </div>
      <div class="bg-cardbg border border-white/10 px-4 py-3 rounded-2xl text-slate-400 text-sm flex items-center gap-2">
        <span class="animate-pulse">Thinking...</span>
      </div>
    `;
    container.appendChild(div);
    scrollToBottom();
    refreshIcons();
  }

  function removeLoadingIndicator() {
    const el = document.getElementById('loading-indicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    const container = document.getElementById('messages-container');
    if (container) container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage(e);
    }
  }

  // NEW: Secure API call via Netlify Function
  async function handleSendMessage(e) {
    if (e) e.preventDefault();
    
    const inputEl = document.getElementById('user-input');
    if (!inputEl) return;
    
    const text = inputEl.value.trim();
    const isSearch = document.getElementById('web-search-toggle')?.checked || false;
    const model = document.getElementById('model-select')?.value || 'llama-3.3-70b-versatile';

    if (!text) return;

    let activeChat = chats.find(c => c.id === currentChatId);
    if (!activeChat) {
      createNewChat();
      activeChat = chats.find(c => c.id === currentChatId);
    }

    if (activeChat.messages.length === 0) {
      activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
      renderChatHistoryList();
    }

    activeChat.messages.push({ role: 'user', content: text });
    inputEl.value = '';
    renderMessages();

    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) sendBtn.disabled = true;
    renderLoadingIndicator();

    try {
      const conversationPayload = activeChat.messages.map(m => ({ role: m.role, content: m.content }));

      // Calls your Netlify Function securely!
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conversationPayload,
          model: model,
          isSearch: isSearch,
          userQuery: text
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Server error occurred.');
      }

      activeChat.messages.push({ role: 'assistant', content: data.reply });
      saveChatsToStorage();

    } catch (err) {
      activeChat.messages.push({ role: 'assistant', content: `Error: ${err.message}` });
      saveChatsToStorage();
    } finally {
      removeLoadingIndicator();
      renderMessages();
      if (sendBtn) sendBtn.disabled = false;
    }
  }
</script>

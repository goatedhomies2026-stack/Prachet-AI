<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prachet AI Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sidebar: '#171717',
            chatbg: '#212121',
            cardbg: '#2f2f2f',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-chatbg text-slate-100 flex h-screen overflow-hidden font-sans">

  <!-- Mobile Sidebar Overlay -->
  <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/50 z-20 md:hidden hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-sidebar border-r border-white/10 z-30 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
    <!-- Sidebar Header / New Chat -->
    <div class="p-3 border-b border-white/10 flex items-center justify-between">
      <button onclick="createNewChat()" class="flex-1 flex items-center justify-between gap-2 border border-white/20 hover:bg-white/10 text-sm font-medium py-2 px-3 rounded-lg transition">
        <span class="flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> New Chat
        </span>
        <i data-lucide="square-pen" class="w-4 h-4 text-slate-400"></i>
      </button>
      <button onclick="toggleSidebar(false)" class="md:hidden p-2 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Chat History List -->
    <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chat-history-list">
      <!-- Dynamically populated -->
    </div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-white/10 space-y-1">
      <button onclick="clearAllChats()" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm text-red-400 hover:bg-red-500/10 rounded-lg transition">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        <span>Clear History</span>
      </button>
    </div>
  </aside>

  <!-- Main Chat Workspace -->
  <main class="flex-1 flex flex-col h-full relative bg-chatbg">
    
    <!-- Top Header Bar -->
    <header class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-chatbg/80 backdrop-blur z-10">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar(true)" class="md:hidden p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-white/10">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Model Selector Dropdown -->
        <div class="relative">
          <select id="model-select" class="bg-transparent text-sm font-semibold text-slate-200 border border-white/10 rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 cursor-pointer">
            <option value="llama-3.3-70b-versatile" class="bg-slate-800">Llama 3.3 70B (Fast & Smart)</option>
            <option value="llama-3.1-8b-instant" class="bg-slate-800">Llama 3.1 8B (Ultra Fast)</option>
            <option value="mixtral-8x7b-32768" class="bg-slate-800">Mixtral 8x7B (Deep Reasoning)</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-indigo-400 font-medium px-2.5 py-1 bg-indigo-500/10 rounded-md border border-indigo-500/20">
          Prachet AI Studio
        </span>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
      <!-- Empty State / Welcome Screen -->
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4">
        <div class="p-4 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl text-indigo-400">
          <i data-lucide="sparkles" class="w-10 h-10"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">What can I help with today?</h2>
        <p class="text-slate-400 text-sm max-w-md">
          Ask questions, solve problems, or toggle web search below for real-time web context.
        </p>
      </div>
    </div>

    <!-- Input Footer Bar -->
    <div class="p-4 max-w-4xl w-full mx-auto">
      <form id="chat-form" onsubmit="handleSendMessage(event)" class="relative bg-cardbg border border-white/10 rounded-2xl shadow-xl focus-within:border-indigo-500/50 transition">
        
        <textarea 
          id="user-input" 
          rows="1" 
          placeholder="Message Prachet AI..." 
          onkeydown="handleKeyDown(event)"
          class="w-full bg-transparent px-4 py-3.5 pr-28 text-sm text-slate-100 placeholder-slate-400 resize-none focus:outline-none max-h-48"
        ></textarea>

        <!-- Controls inside input box -->
        <div class="absolute right-3 bottom-2.5 flex items-center gap-2">
          <!-- Web Search Toggle -->
          <label title="Toggle Web Search" class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-slate-200 cursor-pointer px-2 py-1.5 rounded-lg border border-white/10 hover:bg-white/5 transition">
            <input type="checkbox" id="web-search-toggle" class="accent-indigo-500 rounded">
            <i data-lucide="globe" class="w-3.5 h-3.5 text-indigo-400"></i>
            <span class="hidden sm:inline">Search</span>
          </label>

          <!-- Submit Button -->
          <button 
            type="submit" 
            id="send-btn" 
            class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition disabled:opacity-40"
          >
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
      <div class="text-center text-[11px] text-slate-500 mt-2">
        Prachet AI Studio may produce inaccurate information.
      </div>
    </div>
  </main>

  <!-- JavaScript Logic -->
  <script>
    let chats = JSON.parse(localStorage.getItem('prachet_chats_data')) || [];
    let currentChatId = localStorage.getItem('prachet_current_chat_id') || null;

    function refreshIcons() {
      if (window.lucide && typeof lucide.createIcons === 'function') {
        lucide.createIcons();
      }
    }

    // Direct initialization on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      refreshIcons();
      renderChatHistoryList();

      if (currentChatId && chats.find(c => c.id === currentChatId)) {
        loadChat(currentChatId);
      } else if (chats.length > 0) {
        loadChat(chats[0].id);
      } else {
        createNewChat();
      }
    });

    // Sidebar Toggle
    function toggleSidebar(show) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar) sidebar.classList.toggle('-translate-x-full', !show);
      if (overlay) overlay.classList.toggle('hidden', !show);
    }

    // Chat Data Management
    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Conversation',
        messages: []
      };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      saveChatsToStorage();
      renderChatHistoryList();
      renderMessages();
      toggleSidebar(false);
    }

    function saveChatsToStorage() {
      localStorage.setItem('prachet_chats_data', JSON.stringify(chats));
      localStorage.setItem('prachet_current_chat_id', currentChatId);
    }

    function loadChat(id) {
      currentChatId = id;
      saveChatsToStorage();
      renderChatHistoryList();
      renderMessages();
      toggleSidebar(false);
    }

    function deleteChat(id, event) {
      if (event) event.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      if (currentChatId === id) {
        currentChatId = chats.length > 0 ? chats[0].id : null;
      }
      saveChatsToStorage();
      if (!currentChatId) createNewChat();
      else {
        renderChatHistoryList();
        renderMessages();
      }
    }

    function clearAllChats() {
      if (confirm('Are you sure you want to delete all chat history?')) {
        chats = [];
        localStorage.removeItem('prachet_chats_data');
        localStorage.removeItem('prachet_current_chat_id');
        createNewChat();
      }
    }

    // Render Sidebar History
    function renderChatHistoryList() {
      const container = document.getElementById('chat-history-list');
      if (!container) return;
      container.innerHTML = '';

      chats.forEach(chat => {
        const isActive = chat.id === currentChatId;
        const btn = document.createElement('div');
        btn.onclick = () => loadChat(chat.id);
        btn.className = `group flex items-center justify-between px-3 py-2.5 rounded-lg text-sm cursor-pointer transition ${
          isActive ? 'bg-white/10 text-white font-medium' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'
        }`;
        
        btn.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <i data-lucide="message-square" class="w-4 h-4 shrink-0 ${isActive ? 'text-indigo-400' : ''}"></i>
            <span class="truncate">${escapeHtml(chat.title)}</span>
          </div>
          <button onclick="deleteChat('${chat.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition">
            <i data-lucide="trash" class="w-3.5 h-3.5"></i>
          </button>
        `;
        container.appendChild(btn);
      });
      refreshIcons();
    }

    // Render Messages on Screen
    function renderMessages() {
      const container = document.getElementById('messages-container');
      const emptyState = document.getElementById('empty-state');
      if (!container) return;

      const activeChat = chats.find(c => c.id === currentChatId);
      container.innerHTML = '';

      if (!activeChat || activeChat.messages.length === 0) {
        if (emptyState) {
          container.appendChild(emptyState);
          emptyState.classList.remove('hidden');
        }
        return;
      }

      if (emptyState) emptyState.classList.add('hidden');

      activeChat.messages.forEach(msg => {
        const div = document.createElement('div');
        if (msg.role === 'user') {
          div.className = 'flex justify-end';
          div.innerHTML = `
            <div class="bg-indigo-600 text-white px-4 py-3 rounded-2xl max-w-[85%] md:max-w-[75%] text-sm whitespace-pre-wrap leading-relaxed shadow-sm">
              ${escapeHtml(msg.content)}
            </div>
          `;
        } else {
          div.className = 'flex items-start gap-3 max-w-[90%] md:max-w-[85%]';
          div.innerHTML = `
            <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-xl shrink-0 mt-1 border border-indigo-500/30">
              <i data-lucide="bot" class="w-4 h-4"></i>
            </div>
            <div class="bg-cardbg border border-white/10 p-4 rounded-2xl text-slate-200 text-sm whitespace-pre-wrap leading-relaxed shadow-sm flex-1">
              ${escapeHtml(msg.content)}
            </div>
          `;
        }
        container.appendChild(div);
      });

      scrollToBottom();
      refreshIcons();
    }

    function renderLoadingIndicator() {
      const container = document.getElementById('messages-container');
      if (!container) return;
      const div = document.createElement('div');
      div.id = 'loading-indicator';
      div.className = 'flex items-start gap-3 max-w-[90%] md:max-w-[85%]';
      div.innerHTML = `
        <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-xl shrink-0 mt-1 border border-indigo-500/30">
          <i data-lucide="bot" class="w-4 h-4"></i>
        </div>
        <div class="bg-cardbg border border-white/10 px-4 py-3 rounded-2xl text-slate-400 text-sm flex items-center gap-2">
          <span class="animate-pulse">Thinking...</span>
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
      refreshIcons();
    }

    function removeLoadingIndicator() {
      const el = document.getElementById('loading-indicator');
      if (el) el.remove();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      if (container) container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage(e);
      }
    }

    // Submit via Netlify Function
    async function handleSendMessage(e) {
      if (e) e.preventDefault();
      
      const inputEl = document.getElementById('user-input');
      if (!inputEl) return;
      
      const text = inputEl.value.trim();
      const isSearch = document.getElementById('web-search-toggle')?.checked || false;
      const model = document.getElementById('model-select')?.value || 'llama-3.3-70b-versatile';

      if (!text) return;

      let activeChat = chats.find(c => c.id === currentChatId);
      if (!activeChat) {
        createNewChat();
        activeChat = chats.find(c => c.id === currentChatId);
      }

      if (activeChat.messages.length === 0) {
        activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
        renderChatHistoryList();
      }

      activeChat.messages.push({ role: 'user', content: text });
      inputEl.value = '';
      renderMessages();

      const sendBtn = document.getElementById('send-btn');
      if (sendBtn) sendBtn.disabled = true;
      renderLoadingIndicator();

      try {
        const conversationPayload = activeChat.messages.map(m => ({ role: m.role, content: m.content }));

        const res = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversationPayload,
            model: model,
            isSearch: isSearch,
            userQuery: text
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Server error occurred.');
        }

        activeChat.messages.push({ role: 'assistant', content: data.reply });
        saveChatsToStorage();

      } catch (err) {
        activeChat.messages.push({ role: 'assistant', content: `Error: ${err.message}` });
        saveChatsToStorage();
      } finally {
        removeLoadingIndicator();
        renderMessages();
        if (sendBtn) sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
